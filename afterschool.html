<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방과후 일정</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📅</text></svg>">
<link rel="stylesheet" href="assets/app.css">
<style>
  .as-wrap { max-width: 960px; margin: 0 auto; padding: 18px 16px 48px; }
  body.embed .as-wrap { padding: 2px 2px 8px; }
  body.embed .as-top, body.embed h1, body.embed .as-tabs { display: none; }
  .as-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .as-back { text-decoration: none; color: var(--ink-2); font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: var(--panel); }
  .as-wrap h1 { font-size: 20px; margin: 10px 0 12px; letter-spacing: -.3px; }

  .as-tabs { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; margin-bottom: 14px; }
  .as-tab { border: 0; background: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-2); padding: 7px 18px; border-radius: 999px; }
  .as-tab.on { background: var(--accent); color: #fff; }

  .as-scopelabel { color: var(--ink-2); font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  .as-scopelabel b { color: var(--accent); }
  .as-state { color: var(--ink-3); padding: 24px 4px; font-size: 14px; }
  .as-state.error { color: var(--danger); white-space: pre-line; }

  .as-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .as-day { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 120px; }
  .as-dhead { padding: 9px 10px; border-bottom: 1px solid var(--line-2); display: flex; align-items: baseline; gap: 7px; }
  .as-dname { font-weight: 800; font-size: 15px; }
  .as-ddate { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .as-day.today { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .as-day.today .as-dhead { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .as-day.today .as-dname { color: var(--accent); }

  .as-items { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .as-items li { background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 7px 9px; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .as-empty { color: var(--ink-3); font-size: 12.5px; padding: 10px 9px; }

  .as-wk { margin-bottom: 18px; }
  .as-wklabel { font-size: 14px; font-weight: 800; color: var(--ink-2); margin: 0 0 8px; padding-left: 2px; display: flex; align-items: center; gap: 8px; }
  .as-wk.now .as-wklabel { color: var(--accent); }
  .as-wk.now .as-wklabel::after { content: '이번 주'; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px; }

  /* 날짜를 누르면 그날 강좌 상세. 왼쪽 상세 + 오른쪽 운영시간안내. */
  .as-day.clickable { cursor: pointer; }
  .as-day.clickable:hover { border-color: var(--accent); }
  .as-day.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* 오늘은 작은 '오늘' 표시로 알려 주고, 다른 날을 골랐을 때는 오늘의 진한 강조를 풀어 선택한 날만 진하게 보입니다. */
  .as-day.today .as-dhead::after { content: '오늘'; margin-left: auto; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 7px; align-self: center; }
  .has-sel .as-day.today:not(.sel) { border-color: var(--line); box-shadow: var(--shadow); }
  .has-sel .as-day.today:not(.sel) .as-dhead { background: none; }
  .has-sel .as-day.today:not(.sel) .as-dname { color: inherit; }
  .as-day.sel .as-dhead { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .as-day.sel .as-dname { color: var(--accent); }

  .as-detailrow { display: flex; gap: 12px; margin-top: 20px; align-items: flex-start; }
  .as-detail { flex: 1.6 1 0; min-width: 0; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; }
  .as-detail h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); letter-spacing: -.2px; }
  .dt-prog { margin-bottom: 12px; }
  .dt-ban { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 5px; }
  .dt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .dt-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 6px 9px; }
  .dt-gyosi { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* 반마다 고유 색: 자격A=파랑 · 금공반=주황 · 공무원반=분홍 · 기초A=초록 · 기초B=청록 · 자격B=보라 */
  [data-ban="자격A"]   { --bc: #3b82f6; }
  [data-ban="금공반"]   { --bc: #f08a1c; }
  [data-ban="공무원반"] { --bc: #d946a8; }
  [data-ban="기초A"]   { --bc: #22a35a; }
  [data-ban="기초B"]   { --bc: #0ea5b7; }
  [data-ban="자격B"]   { --bc: #8b5cf6; }
  .as-items li[data-ban], .dt-prog[data-ban] .dt-list li { border-left-color: var(--bc, var(--accent)); }
  .as-items li[data-ban="자격A"], .as-items li[data-ban="금공반"], .as-items li[data-ban="공무원반"], .as-items li[data-ban="기초A"], .as-items li[data-ban="기초B"], .as-items li[data-ban="자격B"] { background: color-mix(in srgb, var(--bc) 13%, var(--panel-2)); color: color-mix(in srgb, var(--bc) 70%, var(--ink)); }
  .dt-prog[data-ban] .dt-ban { color: var(--bc, var(--ink)); }
  .dt-prog[data-ban] .dt-gyosi { color: var(--bc, var(--accent)); }
  .dt-teacher { font-weight: 700; }
  .dt-course { flex: 1 1 120px; }
  .dt-room { color: var(--ink-3); font-size: 12px; }

  .as-note { flex: 1 1 0; min-width: 0; margin-top: 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; }
  .as-note h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); }
  .as-note pre { margin: 0; font: inherit; font-size: 13px; color: var(--ink); white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .as-foot { margin-top: 18px; color: var(--ink-3); font-size: 11.5px; }

  @media (max-width: 720px) {
    .as-grid { grid-template-columns: 1fr; }
    .as-day { min-height: 0; }
    .as-items { flex-direction: row; flex-wrap: wrap; }
    .as-items li { flex: 0 0 auto; }
    .as-detailrow { flex-direction: column; }
  }
</style>
</head>
<body>
<script>
  try { var t = localStorage.getItem('gbgc.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  var EMBED = location.search.indexOf('embed=1') >= 0;
  if (EMBED) document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('embed'); });
</script>

<main class="as-wrap">
  <div class="as-top"><a class="as-back" href="./">← 업무 허브로</a></div>
  <h1>📅 방과후 일정</h1>

  <div class="as-tabs" role="tablist">
    <button type="button" class="as-tab" data-scope="week">이번주</button>
    <button type="button" class="as-tab" data-scope="month">이번달</button>
    <button type="button" class="as-tab" data-scope="next">다음달</button>
  </div>

  <p class="as-scopelabel" id="scopeLabel" hidden></p>
  <div id="state" class="as-state">불러오는 중…</div>
  <section id="view" hidden></section>

  <div class="as-detailrow" id="detailRow" hidden>
    <section class="as-detail" id="detail" hidden></section>
    <section id="noteBox" class="as-note" hidden>
      <h2>운영 시간 안내</h2>
      <pre id="note"></pre>
    </section>
  </div>

  <p class="as-foot" id="foot" hidden></p>
</main>

<script>
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var scope = 'week';
  var _ps = new URLSearchParams(location.search).get('scope');
  if (_ps === 'month' || _ps === 'week' || _ps === 'next') scope = _ps;
  // 허브에서 넘겨준 색(c)으로 강조색을 맞춥니다(방과후·문해력 각각 다른 색).
  var _pc = new URLSearchParams(location.search).get('c');
  if (_pc && /^#?[0-9a-fA-F]{6}$/.test(_pc)) document.documentElement.style.setProperty('--accent', _pc.charAt(0) === '#' ? _pc : '#' + _pc);
  else { try { if (localStorage.getItem('gbgc.as.scope') === 'month') scope = 'month'; } catch (e) {} }

  // 학교 방과후학교 시트(공개 네이티브 구글시트)를 브라우저에서 직접 읽습니다.
  // CORS 가 허용되어 서버(Apps Script)·권한 승인이 전혀 필요 없습니다.
  var SHEET_ID = '1BcvH-vnXmT1xOdROCEC18t3JRUJ3unJo3YWWZOfCxx8';
  var GID = '970771263';
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + GID;
  // 강좌개설 탭 — 날짜를 누르면 보여 줄 교시/교사/강좌명/강의실의 원천.
  var COURSE_GID = '370035100';
  var COURSE_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + COURSE_GID;
  var GRID = null, COURSES = {};

  // 다른 부서에서 운영하는 방과후 강좌(시트에 없음). 예비 산학맞춤반 → '공무원반'
  // 운영: 2026.9.14~12.18, 8·9교시(16:40~18:30), 장소 1학년 3반 교실.
  var EXTRA = [{
    ban: '공무원반', info: '월~금(공무원반): 8,9교시(16:40~18:30)', from: new Date(2026, 8, 14), to: new Date(2026, 11, 18),
    days: {
      '월': { course: '영어', teacher: '이지은' }, '화': { course: '국어', teacher: '이점희' },
      '수': { course: '한국사', teacher: '김명준' }, '목': { course: '영어', teacher: '이지은' },
      '금': { course: '국어', teacher: '이점희' }
    }
  }];
  function addExtraCourses() {
    EXTRA.forEach(function (ex) {
      COURSES[ex.ban] = COURSES[ex.ban] || {};
      Object.keys(ex.days).forEach(function (yo) {
        var c = ex.days[yo];
        (COURSES[ex.ban][yo] = COURSES[ex.ban][yo] || []).push({ gyosi: '8·9교시', teacher: c.teacher, course: c.course, room: '1-3반 교실', grade: '' });
      });
    });
  }
  var NL = String.fromCharCode(10), CR = String.fromCharCode(13);

  // 편성요일 글자로 '반'(방과후일정 칸과 같은 키)을 정합니다.
  function baseKey(p) {
    if (p.indexOf('자격A') >= 0) return '자격A';
    if (p.indexOf('금공반') >= 0) return '금공반';
    if (p.indexOf('기초기본향상') >= 0) return '기초';     // 요일로 기초A(목)·기초B(금) 나눔
    if (p.indexOf('상업경진') >= 0) return '상경진';       // 운영완료 → 제외
    return '';
  }
  // COURSES[반][요일] = [{교시, 교사, 강좌명, 강의실, 학년}]
  function parseCourses(g) {
    var hr = -1;
    for (var i = 0; i < g.length; i++) { if ((g[i] || []).indexOf('강좌명') >= 0) { hr = i; break; } }
    if (hr < 0) return;
    for (var r = hr + 1; r < g.length; r++) {
      var row = g[r], teacher = String(row[1] || '').trim();
      if (!teacher) continue;
      var base = baseKey(String(row[4] || ''));
      if (!base || base === '상경진') continue;
      var course = String(row[6] || '').trim() || String(row[7] || '').trim();
      var room = String(row[8] || '').trim(), grade = String(row[3] || '').trim();
      var su = String(row[5] || ''), re = /([월화수목금])\((\d+)\)/g, m;
      while ((m = re.exec(su))) {
        var yo = m[1], gyosi = m[2].split('').join('·') + '교시';
        var ban = base === '기초' ? (yo === '목' ? '기초A' : '기초B') : base;
        (COURSES[ban] = COURSES[ban] || {});
        (COURSES[ban][yo] = COURSES[ban][yo] || []);
        COURSES[ban][yo].push({ gyosi: gyosi, teacher: teacher, course: course, room: room, grade: grade });
      }
    }
  }

  function parseCSV(s) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (q) {
        if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ',') { row.push(cur); cur = ''; }
        else if (c === NL) { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (c === CR) { /* skip */ }
        else cur += c;
      }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addD(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  function buildData(sc) {
    var g = GRID, hr = -1;
    for (var i = 0; i < g.length; i++) { if (g[i][2] === '월' && g[i][3] === '화') { hr = i; break; } }
    if (hr < 0) throw new Error('요일 표를 찾지 못했습니다.');
    var year = new Date().getFullYear();
    var weeks = [];
    for (var r = hr + 1; r < g.length; r++) {
      var label = String(g[r][1] || '').replace(/\s+/g, ' ').trim();
      var m = /^(\d{1,2})\.(\d{1,2})/.exec(label);
      if (!m) continue;
      weeks.push({ row: r, label: label, mon: new Date(year, (+m[1]) - 1, +m[2]) });
    }
    if (!weeks.length) throw new Error('주차 표를 찾지 못했습니다.');
    var today = midnight(new Date());
    function sameWeek(mon) { return today >= mon && today <= addD(mon, 6); }
    function days(wk) {
      var names = ['월', '화', '수', '목', '금'], out = [];
      for (var d = 0; d < 5; d++) {
        var cell = String(g[wk.row][2 + d] || '');
        var items = cell.split(/[\n,]/).map(function (x) { return x.trim(); }).filter(function (x) { return x && x !== '-'; });
        var dt = addD(wk.mon, d);
        // 다른 부서 운영 강좌(공무원반): 운영 기간 안의 해당 요일에 자동으로 표시합니다.
        EXTRA.forEach(function (ex) {
          if (ex.days[names[d]] && dt >= ex.from && dt <= ex.to && items.indexOf(ex.ban) < 0) items.push(ex.ban);
        });
        out.push({ name: names[d], date: (dt.getMonth() + 1) + '/' + dt.getDate(), isToday: dt.getTime() === today.getTime(), items: items });
      }
      return out;
    }
    var note = String((g[0] && g[0][1]) || '').replace(/\r/g, '').trim();
    if (sc === 'month' || sc === 'next') {
      var baseMo = today.getMonth() + (sc === 'next' ? 1 : 0);
      var mo = ((baseMo % 12) + 12) % 12;
      var list = weeks.filter(function (w) { return w.mon.getMonth() === mo; });
      return { scope: 'month', next: sc === 'next', month: mo + 1, note: note,
        weeks: list.map(function (w) { return { label: w.label, days: days(w), isThisWeek: sameWeek(w.mon) }; }) };
    }
    var pick = null;
    for (var k = 0; k < weeks.length; k++) { if (sameWeek(weeks[k].mon)) { pick = weeks[k]; break; } }
    if (!pick) { for (var k2 = 0; k2 < weeks.length; k2++) { if (weeks[k2].mon <= today && (!pick || weeks[k2].mon > pick.mon)) pick = weeks[k2]; } }
    if (!pick) pick = weeks[0];
    return { scope: 'week', week: pick.label, days: days(pick), note: note };
  }

  function dayCardsHtml(days) {
    return '<div class="as-grid">' + days.map(function (day) {
      var items = (day.items && day.items.length)
        ? '<ul class="as-items">' + day.items.map(function (x) { return '<li data-ban="' + esc(x) + '">' + esc(x) + '</li>'; }).join('') + '</ul>'
        : '<div class="as-empty">일정 없음</div>';
      // 강좌개설에 있는 반이 그날 있으면 클릭해서 상세를 볼 수 있습니다.
      var progs = (day.items || []).filter(function (x) { return COURSES[x]; });
      var clk = progs.length ? ' clickable" data-progs="' + esc(progs.join('|')) + '" data-date="' + esc(day.date) + '" data-yo="' + esc(day.name) + '"' : '"';
      return '<div class="as-day' + (day.isToday ? ' today' : '') + clk + '>' +
        '<div class="as-dhead"><span class="as-dname">' + esc(day.name) + '</span>' +
        '<span class="as-ddate">' + esc(day.date) + '</span></div>' + items + '</div>';
    }).join('') + '</div>';
  }

  // 날짜를 누르면 그날 강좌 상세를 왼쪽에 보여 줍니다(운영시간안내는 오른쪽으로).
  function selectDay(el) {
    if (el.classList.contains('sel')) {   // 같은 날 다시 누르면 닫기
      el.classList.remove('sel'); $('#view').classList.remove('has-sel'); $('#detail').hidden = true; setTimeout(postHeight, 30); return;
    }
    $$('.as-day.sel').forEach(function (d) { d.classList.remove('sel'); });
    el.classList.add('sel');
    $('#view').classList.add('has-sel');
    var progs = el.dataset.progs.split('|'), date = el.dataset.date, yo = el.dataset.yo;
    var html = '<h2>📌 ' + esc(date) + ' (' + esc(yo) + ') 방과후 강좌</h2>', any = false;
    progs.forEach(function (p) {
      var list = (COURSES[p] && COURSES[p][yo]) || [];
      if (!list.length) return;
      any = true;
      html += '<div class="dt-prog" data-ban="' + esc(p) + '"><div class="dt-ban">' + esc(p) + '</div><ul class="dt-list">' +
        list.map(function (s) {
          return '<li><span class="dt-gyosi">' + esc(s.gyosi) + '</span>' +
            '<span class="dt-teacher">' + esc(s.teacher) + '</span>' +
            '<span class="dt-course">' + esc(s.course) + '</span>' +
            '<span class="dt-room">' + esc(s.room) + '</span></li>';
        }).join('') + '</ul></div>';
    });
    if (!any) html += '<div class="as-empty">이 날은 등록된 강좌 상세가 없습니다.</div>';
    var dt = $('#detail'); dt.innerHTML = html; dt.hidden = false;
    setTimeout(postHeight, 30);
  }

  function postHeight() {
    if (!EMBED) return;
    try {
      var h = $('.as-wrap').getBoundingClientRect().height + 10;
      parent.postMessage({ type: 'embedHeight', id: 'asFrame', h: Math.ceil(h) }, '*');
    } catch (e) {}
  }

  function render(d) {
    $('#state').hidden = true;
    var lab = $('#scopeLabel'), view = $('#view');
    if (d.scope === 'month') {
      lab.innerHTML = (d.next ? '다음 달 ' : '이번 달 ') + '<b>' + esc(d.month) + '월</b> · ' + d.weeks.length + '주';
      view.innerHTML = d.weeks.length
        ? d.weeks.map(function (w) {
            return '<div class="as-wk' + (w.isThisWeek ? ' now' : '') + '">' +
              '<p class="as-wklabel">' + esc(w.label) + '</p>' + dayCardsHtml(w.days) + '</div>';
          }).join('')
        : '<div class="as-empty">' + (d.next ? '다음 달' : '이번 달') + ' 일정이 없습니다.</div>';
    } else {
      lab.innerHTML = '이번 주 <b>' + esc(d.week) + '</b>';
      view.innerHTML = dayCardsHtml(d.days);
    }
    lab.hidden = false; view.hidden = false;
    // 새로 그릴 때 상세는 접고(선택 해제), 운영시간안내만 보입니다.
    $('#detail').hidden = true; view.classList.remove('has-sel');
    var noteTxt = d.note || '';
    EXTRA.forEach(function (ex) { if (noteTxt.indexOf(ex.ban) < 0) noteTxt += (noteTxt ? String.fromCharCode(10) : '') + ex.info; });
    if (noteTxt) { $('#note').textContent = noteTxt; $('#noteBox').hidden = false; }
    $('#detailRow').hidden = false;
    // 주 보기: 오늘 수업이 있으면 오늘 강좌 상세를 기본으로 펼쳐 보여 줍니다.
    if (d.scope === 'week') {
      var todayEl = view.querySelector('.as-day.today.clickable');
      if (todayEl) selectDay(todayEl);
    }
    $('#foot').textContent = '학교 방과후학교 시트에서 자동으로 불러옵니다. 날짜를 누르면 그날 강좌가 나옵니다.';
    $('#foot').hidden = false;
    setTimeout(postHeight, 30);
  }

  function showError(msg) {
    $('#view').hidden = true; $('#scopeLabel').hidden = true;
    var el = $('#state'); el.hidden = false; el.className = 'as-state error'; el.textContent = msg;
    setTimeout(postHeight, 30);
  }

  function syncTabs() {
    [].forEach.call(document.querySelectorAll('.as-tab'), function (b) { b.classList.toggle('on', b.dataset.scope === scope); });
  }
  function renderScope() {
    syncTabs();
    try { render(buildData(scope)); } catch (e) { showError('일정을 불러오지 못했습니다.' + NL + e.message); }
  }
  function load() {
    syncTabs();
    $('#state').hidden = false; $('#state').className = 'as-state'; $('#state').textContent = '불러오는 중…';
    $('#view').hidden = true;
    var getCSV = function (url) { return fetch(url, { redirect: 'follow' }).then(function (r) { if (!r.ok) throw new Error('시트 응답 ' + r.status); return r.text(); }); };
    Promise.all([
      getCSV(CSV_URL),
      getCSV(COURSE_URL).catch(function () { return ''; })   // 강좌개설 못 읽어도 일정은 보이게
    ]).then(function (res) {
      GRID = parseCSV(res[0]);
      COURSES = {}; if (res[1]) parseCourses(parseCSV(res[1]));
      addExtraCourses();
      renderScope();
    }).catch(function (e) { showError('일정을 불러오지 못했습니다.' + NL + e.message + NL + '잠시 후 새로고침해 주세요.'); });
  }

  // 날짜(클릭 가능한 칸) 클릭 → 상세
  document.addEventListener('click', function (e) {
    var el = e.target.closest('.as-day.clickable');
    if (el) selectDay(el);
  });

  document.querySelector('.as-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.as-tab'); if (!b || b.dataset.scope === scope) return;
    scope = b.dataset.scope;
    try { localStorage.setItem('gbgc.as.scope', scope); } catch (e2) {}
    if (GRID) renderScope(); else load();
  });

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d && d.type === 'setScope' && (d.scope === 'week' || d.scope === 'month' || d.scope === 'next')) {
      scope = d.scope;
      if (GRID) renderScope(); else load();
    }
  });

  load();
</script>
</body>
</html>
